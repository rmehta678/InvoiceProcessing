[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "galatiq-invoice-agents"
version = "0.1.0"
description = "Auditable AutoGen and xAI Grok invoice-processing prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "autogen-agentchat==0.7.5",
  "autogen-ext[openai]==0.7.5",
  "opentelemetry-api>=1.36,<2",
  "opentelemetry-sdk>=1.36,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "pypdf>=6.15.0,<7",
  "python-dateutil>=2.9,<3",
  "python-dotenv>=1.1,<2",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "playwright>=1.49,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-python-dateutil>=2.9,<3",
]
ui = [
    "fastapi>=0.116,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<0.1",
    "sse-starlette>=2.3,<3",
    "uvicorn>=0.35,<1",
]

[project.scripts]
invoice-agents = "invoice_agents.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_agents"]
include = ["src/invoice_agents/**/*.sql"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "live: calls the paid xAI API and must be explicitly selected",
  "integration: exercises multiple local components",
  "ui_smoke: drives the web console in a real browser; set RUN_UI_SMOKE=1 to run",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["invoice_agents"]

[[tool.mypy.overrides]]
module = ["fitz"]
ignore_missing_imports = true
